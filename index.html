<!DOCTYPE html>
<html lang="en">
<head>
    <title>QISMAT AI | Modular</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">

    <div id="main-container">
        <h1 class="p-5 text-yellow-500">QISMAT AI CORE ACTIVE</h1>
    </div>

    <div id="new-features-layer"></div>

    <script id="core-logic">
        console.log("System Initialized...");
    </script>
    
    <script id="injected-logic"></script>

</body>
    <script>
    // MODULE: BINANCE TOP 50 TRACKER
    const container = document.getElementById('new-features-layer');
    // MODULE: QISMAT AI TERMINAL & WALLET
    const container = document.getElementById('new-features-layer');

    container.innerHTML = `
        <div class="bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-[2.5rem] p-6 mb-6 text-black shadow-xl shadow-yellow-500/20">
            <p class="text-[10px] font-bold opacity-70 uppercase">Total Balance (USDT)</p>
            <h1 class="text-4xl font-extrabold italic tracking-tighter mt-1">$50,245.82</h1>
            <div class="grid grid-cols-2 gap-3 mt-5">
                <button onclick="showModal('deposit')" class="bg-black text-white py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">Deposit</button>
                <button onclick="showModal('withdraw')" class="bg-white/30 backdrop-blur-md text-black py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all border border-black/10">Withdraw</button>
            </div>
        </div>

        <div class="p-6 max-w-md mx-auto bg-zinc-900/90 rounded-[3rem] shadow-2xl border border-white/5">
            <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-yellow-500 mb-4">Market Terminal</h2>
            
            <input type="text" id="coinSearch" onkeyup="filterCoins()" placeholder="Search Coin (e.g. BTC)..." 
            class="w-full bg-black/50 border border-white/10 rounded-2xl px-4 py-3 mb-4 text-[11px] text-white focus:outline-none focus:border-yellow-500 transition-all">
            
            <div id="coin-list" class="space-y-3 h-[400px] overflow-y-auto pr-2 custom-scroll">
                <p class="text-center text-[10px] text-gray-600">Connecting to Nodes...</p>
            </div>
        </div>

        <div id="actionModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-xl z-[999] p-10 flex items-center justify-center text-white">
            <div class="bg-zinc-900 border border-white/10 w-full max-w-xs rounded-[3rem] p-8 text-center">
                <div id="modalContent"></div>
                <button onclick="closeModal()" class="mt-6 text-[9px] text-gray-600 font-bold uppercase tracking-widest underline">Close</button>
            </div>
        </div>
    `;

    async function syncMarket() {
        try {
            const res = await fetch('https://api.binance.com/api/v3/ticker/price');
            const data = await res.json();
            const top50 = data.filter(c => c.symbol.endsWith('USDT')).slice(0, 50);
            const list = document.getElementById('coin-list');
            list.innerHTML = ''; 

            top50.forEach(coin => {
                const symbol = coin.symbol.replace('USDT', '');
                const price = parseFloat(coin.price);
                const signals = ["BUY", "SELL", "HOLD", "UP"];
                const colors = ["text-green-400", "text-red-500", "text-blue-400", "text-yellow-400"];
                const r = Math.floor(Math.random() * 4);

                list.innerHTML += `
                    <div class="flex justify-between items-center bg-black/40 p-4 rounded-2xl border border-white/5 mb-3 transition-all">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center text-[10px] font-black">${symbol}</div>
                            <div>
                                <p class="text-[10px] font-bold">${symbol}/USDT</p>
                                <p class="text-[7px] ${colors[r]} font-black animate-pulse uppercase">AI: ${signals[r]}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-mono font-bold text-yellow-500 italic">$${price.toLocaleString()}</p>
                        </div>
                    </div>
                `;
            });
        } catch (e) { console.log("Sync..."); }
    }

    // SEARCH, MODAL & REFRESH LOGIC
    window.filterCoins = function() {
        let input = document.getElementById('coinSearch').value.toUpperCase();
        let cards = document.getElementById('coin-list').children;
        for (let i = 0; i < cards.length; i++) {
            cards[i].style.display = cards[i].innerText.toUpperCase().includes(input) ? "" : "none";
        }
    }

    window.showModal = function(type) {
        const modal = document.getElementById('actionModal');
        const content = document.getElementById('modalContent');
        modal.classList.remove('hidden');
        if(type === 'deposit') {
            content.innerHTML = `<h3 class="font-bold mb-2 text-yellow-500">Deposit USDT (TRC20)</h3>
            <p class="text-[10px] mb-4 text-gray-400">Send only TRC20 to this address:</p>
            <div class="bg-black p-3 rounded-xl border border-white/5 text-[9px] font-mono break-all text-white">T9yD6ndS3S7uREm9vLwU3W8vD9fS8S7uR</div>`;
        } else {
            content.innerHTML = `<h3 class="font-bold mb-4">Withdraw</h3>
            <input type="text" placeholder="Address" class="w-full bg-black border border-white/10 rounded-xl p-3 text-[10px] mb-2 text-white">
            <input type="number" placeholder="Amount" class="w-full bg-black border border-white/10 rounded-xl p-3 text-[10px] mb-4 text-white">
            <button onclick="alert('Submitted!')" class="w-full bg-white text-black py-3 rounded-xl font-bold text-[10px]">CONFIRM</button>`;
        }
    }

    window.closeModal = function() { document.getElementById('actionModal').classList.add('hidden'); }

    setInterval(syncMarket, 3000);
    syncMarket();
</script>

<style>
    .custom-scroll::-webkit-scrollbar { width: 2px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #f3ba2f; }
</style>
</body>
</html>
