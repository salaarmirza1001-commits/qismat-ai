 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qismat AI | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: sans-serif; }
        .binance-yellow { color: #f3ba2f; }
        .binance-bg-yellow { background-color: #f3ba2f; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="p-4 border-b border-gray-800 bg-[#181a20]">
        <span class="text-xl font-bold">QISMAT <span class="binance-yellow">AI</span></span>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center px-6 text-center">
        <h1 class="text-5xl font-black mb-6">OWN THE <br><span class="binance-yellow">FUTURE.</span></h1>
        <p class="text-gray-400 mb-10">Register now as a Founding Member.</p>

        <button onclick="openModal()" style="cursor: pointer !important;" class="w-full max-w-xs binance-bg-yellow text-black font-bold py-5 rounded-xl shadow-lg transform active:scale-95">
            CLAIM MY SPOT NOW
        </button>
    </main>

    <div id="regModal" class="modal">
        <div class="bg-[#1e2329] p-8 rounded-2xl w-[90%] max-w-sm border border-gray-700">
            <h2 class="text-2xl font-bold mb-4">Register <span class="binance-yellow">Now</span></h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" id="userName" required class="w-full bg-gray-800 border border-gray-700 p-4 rounded-lg mb-4 text-white" placeholder="Full Name">
                <input type="tel" id="userPhone" required class="w-full bg-gray-800 border border-gray-700 p-4 rounded-lg mb-6 text-white" placeholder="WhatsApp Number">
                <button type="submit" class="w-full binance-bg-yellow text-black font-bold py-4 rounded-lg">SUBMIT</button>
            </form>
            <button onclick="closeModal()" class="mt-4 text-gray-500 text-sm">Close</button>
        </div>
    </div>

    <script>
        function openModal() {
            console.log("Opening...");
            document.getElementById('regModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('regModal').style.display = 'none';
        }
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const waLink = `https://wa.me/923238634863?text=Hi, I am ${name}. I want to join Qismat AI.`;
            window.location.href = waLink;
        }
    </script>
</body>
</html>
