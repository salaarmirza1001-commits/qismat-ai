 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qismat AI | Founding Member</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; margin: 0; }
        .binance-yellow { color: #f3ba2f; }
        .binance-bg-yellow { background-color: #f3ba2f; }
        .card-gradient { background: linear-gradient(135deg, #1e2329 0%, #0b0e11 100%); border: 1px solid #474d57; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .glow-button { box-shadow: 0 4px 20px rgba(243, 186, 47, 0.2); transition: all 0.3s ease; }
        .glow-button:active { transform: scale(0.95); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="p-5 flex justify-between items-center border-b border-gray-800 bg-[#181a20]">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 binance-bg-yellow rounded flex items-center justify-center text-black font-bold">Q</div>
            <span class="text-xl font-bold tracking-tighter uppercase">Qismat <span class="binance-yellow">AI</span></span>
        </div>
        <div class="text-[10px] bg-gray-800 px-2 py-1 rounded text-gray-500 uppercase tracking-widest font-bold">v1.0 Beta</div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center px-6 text-center py-20">
        <div class="mb-6 px-4 py-1 rounded-full bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 text-[10px] font-bold uppercase tracking-[0.2em]">
            Elite Founding Member Access
        </div>
        
        <h1 class="text-5xl md:text-7xl font-black mb-6 leading-[1.1] tracking-tighter">
            OWN THE <br><span class="binance-yellow uppercase">Future.</span>
        </h1>
        
        <p class="text-gray-400 max-w-xs mb-12 text-lg leading-relaxed">
            Register now to claim your exclusive spot in the world's most powerful AI ecosystem.
        </p>

        <button onclick="openModal()" class="w-full max-w-xs binance-bg-yellow text-black font-extrabold py-5 rounded-2xl glow-button text-lg uppercase tracking-widest">
            Claim My Spot Now
        </button>

        <div class="mt-12 flex space-x-6 text-gray-600 text-[10px] font-bold uppercase tracking-widest">
            <span><i class="fas fa-shield-alt binance-yellow mr-1"></i> Secure</span>
            <span><i class="fas fa-bolt binance-yellow mr-1"></i> Instant</span>
            <span><i class="fas fa-check-circle binance-yellow mr-1"></i> Verified</span>
        </div>
    </main>

    <div id="regModal" class="modal px-4">
        <div class="card-gradient p-8 rounded-[2rem] w-full max-w-sm relative border-yellow-500/30">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-500">
                <i class="fas fa-times text-xl"></i>
            </button>
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold">Join <span class="binance-yellow">Qismat</span></h2>
                <p class="text-gray-500 text-sm mt-2 font-medium">Complete your registration</p>
            </div>
            
            <form id="regForm" onsubmit="handleRegister(event)" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase mb-2 ml-1 tracking-widest">Your Full Name</label>
                    <input type="text" id="userName" required class="w-full bg-[#2b2f36] border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:border-[#f3ba2f] transition-all" placeholder="Enter name">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase mb-2 ml-1 tracking-widest">WhatsApp Number</label>
                    <input type="tel" id="userPhone" required class="w-full bg-[#2b2f36] border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:border-[#f3ba2f] transition-all" placeholder="+92 3XX XXXXXXX">
                </div>
                <button type="submit" class="w-full binance-bg-yellow text-black font-bold py-5 rounded-xl mt-4 shadow-lg uppercase tracking-wider">
                    Verify Registration
                </button>
            </form>
        </div>
    </div>

    <footer class="p-8 border-t border-gray-900 text-center">
        <p class="text-[9px] text-gray-600 uppercase tracking-[0.3em]">© 2026 Qismat AI Ecosystem</p>
    </footer>

    <script>
        function openModal() {
            document.getElementById('regModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('regModal').style.display = 'none';
        }
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            
            // Generate WhatsApp Link with custom message
            const message = `Hello Qismat AI! I want to join as a Founding Member.\nName: ${name}\nNumber: ${phone}`;
            const encoded = encodeURIComponent(message);
            window.location.href = `https://wa.me/+9203066181975?text=${encoded}`;
        }
    </script>
</body>
</html>
