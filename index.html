 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qismat AI | Global Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; margin: 0; }
        .binance-yellow { color: #f3ba2f; }
        .binance-bg-yellow { background-color: #f3ba2f; }
        .glass-card { background: rgba(30, 35, 41, 0.9); border: 1px solid rgba(71, 77, 87, 0.5); border-radius: 2.5rem; }
        .progress-bar { height: 10px; background: #2b2f36; border-radius: 5px; overflow: hidden; }
        .progress-fill { width: 35%; background: #f3ba2f; box-shadow: 0 0 15px rgba(243, 186, 47, 0.4); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .language-select { background: #181a20; border: 1px solid #474d57; color: #f3ba2f; border-radius: 8px; font-size: 12px; padding: 5px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="p-4 flex justify-between items-center bg-[#181a20] border-b border-gray-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 binance-bg-yellow rounded flex items-center justify-center text-black font-bold text-sm">Q</div>
            <span class="text-lg font-bold uppercase tracking-tighter">Qismat <span class="binance-yellow">AI</span></span>
        </div>
        
        <select onchange="changeLanguage(this.value)" class="language-select outline-none">
            <option value="en">English 🇺🇸</option>
            <option value="ur">اردو 🇵🇰</option>
            <option value="ar">العربية 🇸🇦</option>
            <option value="zh">中文 🇨🇳</option>
            <option value="es">Español 🇪🇸</option>
            <option value="hi">हिन्दी 🇮🇳</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="de">Deutsch 🇩🇪</option>
            <option value="tr">Türkçe 🇹🇷</option>
            <option value="ru">Русский 🇷🇺</option>
            <option value="pt">Português 🇧🇷</option>
            <option value="id">Indonesia 🇮🇩</option>
            <option value="bn">বাংলা 🇧🇩</option>
            <option value="ja">日本語 🇯🇵</option>
            <option value="ko">한국어 🇰🇷</option>
            <option value="it">Italiano 🇮🇹</option>
            <option value="vi">Tiếng Việt 🇻🇳</option>
            <option value="fa">فارسی 🇮🇷</option>
            <option value="th">ไทย 🇹🇭</option>
            <option value="ms">Malay 🇲🇾</option>
        </select>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center px-6 py-10 text-center">
        <h1 id="heroText" class="text-4xl font-black mb-4 italic tracking-tighter leading-tight">
            of <br><span class="binance-yellow text-5xl uppercase not-italic">Intelligence.</span>
        </h1>
        
        <p id="subText" class="text-gray-400 text-sm max-w-xs mb-8 leading-relaxed font-medium">
            Global community-powered AI ecosystem. Zero investment. Join the elite 500.
        </p>

        <div class="w-full max-w-sm glass-card p-10 shadow-2xl">
            <div class="flex justify-between items-end mb-5">
                <span id="slotLabel" class="text-sm font-bold text-gray-300 uppercase tracking-widest">Founding Slots</span>
                <span class="text-3xl font-black binance-yellow tracking-tighter">142<span class="text-gray-600 text-lg">/500</span></span>
            </div>
            
            <div class="progress-bar mb-10">
                <div class="progress-fill h-full"></div>
            </div>
            
            <button id="ctaButton" onclick="openModal()" class="w-full binance-bg-yellow text-black font-black py-5 rounded-2xl text-lg uppercase tracking-widest shadow-lg active:scale-95 transition-all">
                Claim My Spot Now
            </button>
            
            <p id="footerSecurity" class="text-[9px] text-gray-500 uppercase mt-8 tracking-widest font-bold">
                Protected by AI Security
            </p>
        </div>
    </main>

    <div id="regModal" class="modal px-4">
        <div class="bg-[#1e2329] p-8 rounded-[2.5rem] w-full max-w-sm relative border border-gray-700 shadow-2xl text-center">
            <h2 id="modalTitle" class="text-2xl font-bold mb-8 uppercase italic">Founder Registration</h2>
            <form onsubmit="handleRegister(event)" class="space-y-6">
                <input type="text" id="userName" required class="w-full bg-[#2b2f36] border border-gray-700 rounded-xl p-5 text-white outline-none" placeholder="Your Name">
                <button type="submit" id="submitBtn" class="w-full binance-bg-yellow text-black font-black py-4 rounded-xl uppercase tracking-widest">Generate ID</button>
            </form>
        </div>
    </div>

    <div id="successScreen" class="hidden fixed inset-0 bg-[#0b0e11] z-[110] flex flex-col items-center justify-center px-6">
        <div class="founder-card w-full max-w-sm p-10 rounded-[3rem] text-center border-t-4 border-yellow-500">
            <i class="fas fa-crown text-4xl binance-yellow mb-4"></i>
            <h3 id="cardRank" class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-2">Elite Founding Member</h3>
            <h2 id="cardName" class="text-3xl font-black text-white uppercase mb-4 tracking-tighter underline decoration-yellow-500">USER</h2>
            <p class="text-green-500 font-bold text-sm tracking-widest uppercase">Verified ✅</p>
        </div>
        <button onclick="redirectToWA()" class="mt-8 text-black binance-bg-yellow px-12 py-5 rounded-full font-black text-sm uppercase tracking-widest shadow-2xl">
            WhatsApp Admin
        </button>
    </div>

    <script>
        const translations = {
            en: { hero: "of <br><span class='binance-yellow text-5xl uppercase not-italic'>Intelligence.</span>", sub: "Global community-powered AI ecosystem.", slots: "Founding Slots", cta: "Claim My Spot Now", security: "Protected by AI Security", modal: "Founder Registration", rank: "Elite Founding Member" },
            ur: { hero: "ذہانت کا <br><span class='binance-yellow text-5xl uppercase not-italic'>مستقبل۔</span>", sub: "عالمی کمیونٹی سے چلنے والا اے آئی نظام۔", slots: "مخصوص نشستیں", cta: "ابھی شامل ہوں", security: "اے آئی سیکیورٹی سے محفوظ", modal: "ممبر رجسٹریشن", rank: "ممبر آئی ڈی" },
            ar: { hero: "مستقبل <br><span class='binance-yellow text-5xl uppercase not-italic'>الذكاء.</span>", sub: "نظام عالمي يعمل بالذكاء الاصطناعي.", slots: "الفتحات التأسيسية", cta: "احصل على مكانك", security: "محمي بأمن الذكاء الاصطناعي", modal: "تسجيل المؤسس", rank: "عضو مؤسس نخبة" }
            // More translations can be added here
        };

        function changeLanguage(lang) {
            const t = translations[lang] || translations['en'];
            document.getElementById('heroText').innerHTML = t.hero;
            document.getElementById('subText').innerText = t.sub;
            document.getElementById('slotLabel').innerText = t.slots;
            document.getElementById('ctaButton').innerText = t.cta;
            document.getElementById('footerSecurity').innerText = t.security;
            document.getElementById('modalTitle').innerText = t.modal;
            document.getElementById('cardRank').innerText = t.rank;
        }

        let userData = { name: "" };
        function openModal() { document.getElementById('regModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('regModal').style.display = 'none'; }
        
        function handleRegister(e) {
            e.preventDefault();
            userData.name = document.getElementById('userName').value;
            document.getElementById('cardName').innerText = userData.name;
            document.getElementById('regModal').style.display = 'none';
            document.getElementById('successScreen').classList.remove('hidden');
        }

        function redirectToWA() {
            const myNumber = "923198634863"; 
            const msg = `Global Registration: ${userData.name} wants to join Qismat AI.`;
            window.location.href = `https://wa.me/${myNumber}?text=${encodeURIComponent(msg)}`;
        }
    </script>
</body>
</html>
