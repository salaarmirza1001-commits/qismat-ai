 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QISMAT AI | Dimension-X Sovereign</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@300;800&display=swap');
        
        body { background: #000; color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; overflow: hidden; height: 100vh; }
        .binance-yellow { color: #f3ba2f; }
        .binance-bg-yellow { background: #f3ba2f; }
        
        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        
        .dimension-card {
            background: rgba(5, 5, 5, 0.85);
            border: 2px solid rgba(243, 186, 47, 0.4);
            backdrop-filter: blur(50px);
            border-radius: 50px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 100px rgba(243, 186, 47, 0.15);
        }

        .mining-glow { animation: mining 2s infinite alternate; }
        @keyframes mining { from { opacity: 0.3; transform: scale(0.9); } to { opacity: 1; transform: scale(1.1); } }

        .rank-badge { background: linear-gradient(90deg, #f3ba2f, #ffd700); color: black; padding: 2px 10px; border-radius: 5px; font-weight: 900; font-size: 8px; }
        
        /* Hacker Red Alert */
        .red-alert { animation: red-flash 0.5s infinite; }
        @keyframes red-flash { 0% { background: #000; } 50% { background: #300; } }
    </style>
</head>
<body onload="bootSystem()">

    <canvas id="neuralCanvas"></canvas>

    <div class="fixed top-0 w-full z-50 bg-black/90 border-b border-yellow-500/30 py-1 flex justify-between px-4">
        <div class="text-[8px] font-bold binance-yellow uppercase tracking-widest" id="protocolStatus">Protocol: Dimension-X Active</div>
        <div class="text-[8px] font-bold text-gray-500" id="clock">--:--:--</div>
    </div>

    <nav class="relative z-20 p-8 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-14 h-14 binance-bg-yellow rounded-2xl flex items-center justify-center text-black font-black text-3xl shadow-glow">Q</div>
            <div>
                <h1 class="text-2xl font-black font-syncopate tracking-tighter">QISMAT <span class="binance-yellow">AI</span></h1>
                <span id="rankBadge" class="rank-badge">BRONZE FOUNDER</span>
            </div>
        </div>
        <div class="text-right">
            <p class="text-[7px] text-gray-500 uppercase tracking-widest">Quantum Shield</p>
            <p class="text-[10px] text-green-500 font-black">STABLE</p>
        </div>
    </nav>

    <main id="initPanel" class="relative z-20 flex flex-col items-center justify-center px-6 h-[70vh]">
        <div class="w-full max-w-lg dimension-card p-12 text-center">
            <div class="mb-8 relative inline-block">
                <i class="fas fa-biohazard text-6xl binance-yellow mining-glow"></i>
            </div>
            <h2 class="text-3xl font-black mb-4 uppercase italic">Sovereign <br><span class="binance-yellow text-6xl">Node.</span></h2>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.4em] mb-12">Universal Earning Protocol v14.0</p>

            <button onclick="executeQuantumScan()" class="w-full binance-bg-yellow text-black font-black py-7 rounded-[2rem] text-2xl uppercase tracking-widest shadow-2xl hover:scale-105 active:scale-95 transition-all">
                SECURE IDENTITY
            </button>
        </div>
    </main>

    <div id="dashPanel" class="hidden fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center px-6 overflow-y-auto">
        <div class="w-full max-w-sm dimension-card p-10 border-t-8 border-yellow-500">
            <div class="flex justify-between items-center mb-12">
                <div class="text-left">
                    <p class="text-[7px] text-gray-600 font-black uppercase">Identity Verified</p>
                    <p id="ownerName" class="text-xs font-bold text-white uppercase italic">USER</p>
                </div>
                <div class="text-right">
                    <p class="text-[7px] text-gray-600 font-black uppercase">Node Hash</p>
                    <p id="nodeHash" class="text-[9px] font-mono text-yellow-500">QAI-X99</p>
                </div>
            </div>

            <div class="text-center py-10 bg-white/5 rounded-[2.5rem] border border-white/5 mb-8">
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Net Revenue Generated</p>
                <h3 class="text-6xl font-black text-green-500 my-4 tracking-tighter">$<span id="bal">0.00000</span></h3>
                <div class="flex justify-center items-center space-x-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
                    <span class="text-[8px] text-gray-600 font-bold">MINING LIVE AT 14.2 TH/S</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="requestWithdraw()" class="bg-white/10 text-white font-bold py-5 rounded-2xl text-[10px] uppercase tracking-widest border border-white/5 hover:bg-white/20 transition-all">WITHDRAW</button>
                <button onclick="requestWithdraw()" class="binance-bg-yellow text-black font-black py-5 rounded-2xl text-[10px] uppercase tracking-widest shadow-xl">SWAP NODE</button>
            </div>
            
            <p class="text-[7px] text-gray-600 text-center font-bold uppercase">All assets secured by Quantum Encryption Standard</p>
        </div>
    </div>

    <script>
        // Neural Background Logic
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let dots = [];
        for(let i=0; i<50; i++) dots.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2 });

        function drawNeural() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(243, 186, 47, 0.15)";
            ctx.lineWidth = 0.5;
            dots.forEach((d, i) => {
                d.x += d.vx; d.y += d.vy;
                if(d.x<0 || d.x>canvas.width) d.vx*=-1;
                if(d.y<0 || d.y>canvas.height) d.vy*=-1;
                for(let j=i+1; j<dots.length; j++){
                    let dist = Math.hypot(d.x-dots[j].x, d.y-dots[j].y);
                    if(dist < 150) {
                        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawNeural);
        }
        drawNeural();

        // System Core Logic
        let currentBal = 0.00000;
        function bootSystem() {
            setInterval(() => {
                let now = new Date();
                document.getElementById('clock').innerText = now.getHours() + ":" + now.getMinutes() + ":" + now.getSeconds();
            }, 1000);

            if(localStorage.getItem('dimension_auth')) {
                showDash();
            }
        }

        function executeQuantumScan() {
            const n = prompt("IDENTITY PROTOCOL: Enter Legal Name to sync with Dimension-X Node");
            if(n) {
                localStorage.setItem('dimension_auth', 'true');
                localStorage.setItem('dimension_name', n);
                localStorage.setItem('dimension_id', 'X-NODE-' + Math.floor(100000 + Math.random()*900000));
                showDash();
            }
        }

        function showDash() {
            document.getElementById('initPanel').classList.add('hidden');
            document.getElementById('dashPanel').classList.remove('hidden');
            document.getElementById('ownerName').innerText = localStorage.getItem('dimension_name');
            document.getElementById('nodeHash').innerText = localStorage.getItem('dimension_id');
            
            // Earning Simulation
            setInterval(() => {
                currentBal += 0.00021;
                document.getElementById('bal').innerText = currentBal.toFixed(5);
                
                // Rank Progression
                if(currentBal > 0.05) {
                    document.getElementById('rankBadge').innerText = "DIAMOND FOUNDER";
                    document.getElementById('rankBadge').style.background = "linear-gradient(90deg, #00f2fe, #4facfe)";
                } else if(currentBal > 0.01) {
                    document.getElementById('rankBadge').innerText = "GOLD FOUNDER";
                }
            }, 2000);
        }

        function requestWithdraw() {
            const name = localStorage.getItem('dimension_name');
            const id = localStorage.getItem('dimension_id');
            const bal = document.getElementById('bal').innerText;
            const wa = "923198634863";
            const msg = `DIMENSION-X_WITHDRAWAL_PROTOCOL\n------------------------\nFOUNDER: ${name}\nNODE_ID: ${id}\nCLAIM_VAL: $${bal}\nSTATUS: BIOMETRIC_PASSED\n------------------------\nAuthorize transfer to my wallet.`;
            window.location.href = `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
        }

        // Hacker Red Alert Logic (If someone opens console)
        window.addEventListener('keydown', (e) => {
            if(e.ctrlKey && e.shiftKey && e.keyCode == 73) {
                document.body.classList.add('red-alert');
                alert("CRITICAL SECURITY ALERT: Unauthorized Access Detected. Locking Node...");
            }
        });
    </script>
</body>
</html>
