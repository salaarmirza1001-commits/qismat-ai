<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qismat AI | Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #f3ba2f; border-radius: 10px; }
    </style>
</head>
<body class="bg-black">

    <div id="app" class="max-w-md mx-auto min-h-screen pb-10">
        
        <div class="p-6">
            <div class="bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-[2.5rem] p-8 text-black shadow-2xl shadow-yellow-500/20">
                <p class="text-[10px] font-black opacity-60 uppercase tracking-widest">Available Balance</p>
                <h1 class="text-4xl font-black italic tracking-tighter mt-1">$50,245.82</h1>
                <div class="flex space-x-2 mt-6">
                    <button onclick="showModal('deposit')" class="flex-1 bg-black text-white py-4 rounded-2xl text-[10px] font-black uppercase">Deposit</button>
                    <button onclick="showModal('withdraw')" class="flex-1 bg-white/30 backdrop-blur-md text-black py-4 rounded-2xl text-[10px] font-black uppercase border border-black/10">Withdraw</button>
                </div>
            </div>
        </div>

        <div class="px-6">
            <div class="bg-zinc-900/50 border border-white/5 rounded-[3rem] p-6">
                <input type="text" id="coinSearch" onkeyup="filterCoins()" placeholder="Search (BTC, ETH, SOL)..." 
                class="w-full bg-black/50 border border-white/10 rounded-2xl px-5 py-4 mb-6 text-[11px] text-white outline-none focus:border-yellow-500">
                
                <div id="coin-list" class="space-y-4 h-[400px] overflow-y-auto pr-2 custom-scroll">
                    <p class="text-center text-[10px] text-zinc-600 animate-pulse">Loading AI Nodes...</p>
                </div>
            </div>
        </div>

        <div id="actionModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-xl z-[999] flex items-center justify-center p-10">
            <div class="bg-zinc-900 border border-white/10 w-full max-w-xs rounded-[3rem] p-8 text-center">
                <div id="modalContent"></div>
                <button onclick="closeModal()" class="mt-8 text-[9px] text-zinc-500 font-black uppercase">Close</button>
            </div>
        </div>
    </div>

    <script>
        // SYNC DATA
        async function syncMarket() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price');
                const data = await res.json();
                const top50 = data.filter(c => c.symbol.endsWith('USDT')).slice(0, 50);
                const list = document.getElementById('coin-list');
                
                let html = '';
                top50.forEach(coin => {
                    const symbol = coin.symbol.replace('USDT', '');
                    const price = parseFloat(coin.price);
                    const formattedPrice = price.toLocaleString(undefined, { minimumFractionDigits: (price < 1) ? 4 : 2 });

                    html += `
                        <div class="flex justify-between items-center bg-zinc-800/30 p-5 rounded-[2rem] border border-white/5">
                            <div class="flex items-center space-x-4">
                                <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-[10px] font-black text-yellow-500">${symbol}</div>
                                <div>
                                    <p class="text-[10px] font-black">${symbol}/USDT</p>
                                    <p class="text-[8px] text-green-400 font-black animate-pulse uppercase">AI: BUY SIGNAL</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-mono font-bold text-yellow-500 italic">$${formattedPrice}</p>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch (e) { console.log("Error"); }
        }

        // UTILS
        window.filterCoins = function() {
            const input = document.getElementById('coinSearch').value.toUpperCase();
            const cards = document.getElementById('coin-list').children;
            for (let i = 0; i < cards.length; i++) {
                cards[i].style.display = cards[i].innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        window.showModal = function(type) {
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            if(type === 'deposit') {
                content.innerHTML = `<h3 class="text-yellow-500 font-black mb-4 uppercase">Deposit USDT</h3>
                <div class="bg-black p-4 rounded-xl text-[9px] font-mono break-all text-white mb-4 italic font-bold text-center">T9yD6ndS3S7uREm9vLwU3W8vD9fS8S7uR</div>
                <p class="text-[8px] text-zinc-500 uppercase font-bold">Network: TRC20 (TRON)</p>`;
            } else {
                content.innerHTML = `<h3 class="text-white font-black mb-4 uppercase">Withdrawal</h3>
                <input type="text" placeholder="Address" class="w-full bg-black border border-white/10 rounded-xl p-4 text-[10px] mb-3 text-white outline-none">
                <button onclick="alert('Submitted')" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-black text-[10px]">CONFIRM</button>`;
            }
        }

        window.closeModal = function() { document.getElementById('actionModal').classList.add('hidden'); }

        setInterval(syncMarket, 5000);
        syncMarket();
    </script>
</body>
</html>
