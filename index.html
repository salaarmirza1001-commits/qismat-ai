<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qismat AI | Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; }
        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #f3ba2f; border-radius: 10px; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-black overflow-x-hidden">

    <div id="app" class="max-w-md mx-auto min-h-screen pb-20">
        
        <div class="p-6">
            <div class="bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-[2.5rem] p-7 text-black shadow-2xl shadow-yellow-500/20 relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-[10px] font-black opacity-60 uppercase tracking-widest">Available Balance</p>
                    <h1 class="text-4xl font-black italic tracking-tighter mt-1">$50,245.82</h1>
                    <div class="flex space-x-2 mt-4">
                        <button onclick="showModal('deposit')" class="flex-1 bg-black text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">Deposit</button>
                        <button onclick="showModal('withdraw')" class="flex-1 bg-white/30 backdrop-blur-md text-black py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all border border-black/10">Withdraw</button>
                    </div>
                </div>
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            </div>
        </div>

        <div class="px-6">
            <div class="bg-zinc-900/50 border border-white/5 rounded-[3rem] p-6 shadow-2xl backdrop-blur-sm">
                <div class="flex justify-between items-center mb-6 px-2">
                    <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-yellow-500">AI Market Live</h2>
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-ping"></div>
                </div>

                <input type="text" id="coinSearch" onkeyup="filterCoins()" placeholder="Search (BTC, ETH, SOL)..." 
                class="w-full bg-black/50 border border-white/10 rounded-2xl px-5 py-4 mb-6 text-[11px] text-white focus:outline-none focus:border-yellow-500/50 transition-all placeholder:text-zinc-700">
                
                <div id="coin-list" class="space-y-4 h-[400px] overflow-y-auto pr-2 custom-scroll">
                    <p class="text-center text-[10px] text-zinc-600 mt-20 animate-pulse">Connecting to Binance Nodes...</p>
                </div>
            </div>
        </div>

        <div id="actionModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-xl z-[999] p-10 flex items-center justify-center">
            <div class="bg-zinc-900 border border-white/10 w-full max-w-xs rounded-[3.5rem] p-10 text-center shadow-3xl">
                <div id="modalContent"></div>
                <button onclick="closeModal()" class="mt-8 text-[9px] text-zinc-500 font-black uppercase tracking-[0.2em] hover:text-white transition-colors">← Back to Terminal</button>
            </div>
        </div>

    </div>

    <script>
        // 1. SYNC MARKET DATA
        async function syncMarket() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price');
                const data = await res.json();
                const top50 = data.filter(c => c.symbol.endsWith('USDT')).slice(0, 50);
                const list = document.getElementById('coin-list');
                
                let html = '';
                top50.forEach(coin => {
                    const symbol = coin.symbol.replace('USDT', '');
                    const price = parseFloat(coin.price);
                    const signals = ["BUY", "SELL", "HOLD", "UP"];
                    const colors = ["text-green-400", "text-red-500", "text-blue-400", "text-yellow-400"];
                    const r = Math.floor(Math.random() * 4);
                    const formattedPrice = price.toLocaleString(undefined, { minimumFractionDigits: (price < 1) ? 5 : 2 });

                    html += `
                        <div class="flex justify-between items-center bg-zinc-800/30 p-5 rounded-[2rem] border border-white/5 hover:border-yellow-500/20 transition-all group">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center text-[11px] font-black text-yellow-500 group-hover:scale-110 transition-transform">${symbol}</div>
                                <div>
                                    <p class="text-[11px] font-black text-white">${symbol}/USDT</p>
                                    <p class="text-[8px] ${colors[r]} font-black animate-pulse">AI: ${signals[r]} SIGNAL</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-mono font-bold text-yellow-500 italic">$${formattedPrice}</p>
                                <p class="text-[7px] text-zinc-600 font-bold uppercase tracking-widest mt-1">Live Node</p>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch (e) { console.log("Re-syncing..."); }
        }

        // 2. SEARCH LOGIC
        window.filterCoins = function() {
            const input = document.getElementById('coinSearch').value.toUpperCase();
            const cards = document.getElementById('coin-list').children;
            for (let i = 0; i < cards.length; i++) {
                cards[i].style.display = cards[i].innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        // 3. MODAL LOGIC (DEPOSIT/WITHDRAW)
        window.showModal = function(type) {
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            if(type === 'deposit') {
                content.innerHTML = `
                    <div class="bg-yellow-500 w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-black text-2xl mb-6 shadow-lg shadow-yellow-500/20">↓</div>
                    <h3 class="text-white font-black text-xl italic mb-2">Deposit USDT</h3>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-widest mb-6 font-bold">Network: TRON (TRC20)</p>
                    <div class="bg-black p-5 rounded-2xl border border-yellow-500/20 mb-4 select-all">
                        <p class="text-[10px] text-yellow-500 font-mono break-all font-bold">T9yD6ndS3S7uREm9vLwU3W8vD9fS8S7uR</p>
                    </div>
                    <p class="text-[8px] text-zinc-600">Scan or copy address to deposit. Updates in 5-10 mins.</p>
                `;
            } else {
                content.innerHTML = `
                    <div class="bg-white/10 w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-white text-2xl mb-6">↑</div>
                    <h3 class="text-white font-black text-xl italic mb-6">Withdraw</h3>
                    <input type="text" placeholder="Wallet Address" class="w-full bg-black border border-white/5 rounded-2xl p-4 text-[11px] mb-3 text-white outline-none focus:border-yellow-500">
                    <input type="number" placeholder="Amount (USDT)" class="w-full bg-black border border-white/5 rounded-2xl p-4 text-[11px] mb-6 text-white outline-none focus:border-yellow-500">
                    <button onclick="alert('Withdrawal Request Sent!')" class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-black text-[11px] tracking-widest uppercase">Confirm</button>
                `;
            }
        }

        window.closeModal = function() { document.getElementById('actionModal').classList.add('hidden'); }

        // INITIALIZE
        setInterval(syncMarket, 5000);
        syncMarket();
    </script>
</body>
</html>
